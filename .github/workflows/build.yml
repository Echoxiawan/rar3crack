name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ---------- macOS (Metal enabled) ----------
  macos:
    name: macOS (Metal)
    runs-on: macos-14          # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Self-test
        run: ./build/selftest
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/rar3crack-macos-arm64.tar.gz -C build rar3crack selftest
      - uses: actions/upload-artifact@v4
        with:
          name: rar3crack-macos-arm64
          path: dist/*.tar.gz

  # ---------- Windows (CPU + OpenCL) ----------
  windows:
    name: Windows (CPU+OpenCL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAR3_WITH_OPENCL=ON
      - name: Build
        run: cmake --build build --config Release -j
      - name: Self-test
        run: .\build\Release\selftest.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Release/rar3crack.exe, build/Release/selftest.exe -DestinationPath dist/rar3crack-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rar3crack-windows-x64
          path: dist/*.zip

  # ---------- Linux (CPU + OpenCL) ----------
  linux:
    name: Linux (CPU+OpenCL)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential ocl-icd-opencl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAR3_WITH_OPENCL=ON
      - name: Build
        run: cmake --build build -j
      - name: Self-test
        run: ./build/selftest
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/rar3crack-linux-x64.tar.gz -C build rar3crack selftest
      - uses: actions/upload-artifact@v4
        with:
          name: rar3crack-linux-x64
          path: dist/*.tar.gz

  # ---------- Release: attach all artifacts to a GitHub Release on tag ----------
  release:
    name: Release
    needs: [ macos, windows, linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
