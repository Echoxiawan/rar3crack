name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ---------- macOS (Metal enabled) ----------
  macos:
    name: macOS (Metal)
    runs-on: macos-14          # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Self-test
        run: ./build/selftest
      - uses: actions/upload-artifact@v4
        with:
          name: rar3crack-macos-arm64
          path: build/rar3crack

  # ---------- Windows (CPU only; GitHub runners have no OpenCL SDK) ----------
  windows:
    name: Windows (CPU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Self-test
        run: .\build\Release\selftest.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rar3crack-windows-x64
          path: build/Release/rar3crack.exe

  # ---------- Linux (CPU + OpenCL) ----------
  linux:
    name: Linux (CPU+OpenCL)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential ocl-icd-opencl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAR3_WITH_OPENCL=ON
      - name: Build
        run: cmake --build build -j
      - name: Self-test
        run: ./build/selftest
      - uses: actions/upload-artifact@v4
        with:
          name: rar3crack-linux-x64
          path: build/rar3crack

  # ---------- Release: attach raw binaries to a GitHub Release on tag ----------
  release:
    name: Release
    needs: [ macos, windows, linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by action-gh-release to create the Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - name: Extract tag message as changelog
        run: |
          git fetch origin --tags --force --quiet
          {
            git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}"
            echo
            git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}"
          } > body.md
          cat body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: body.md
          generate_release_notes: true
